server {
    listen 443 ssl;
    server_name uploads.example.com;

    # Request-body cap at the proxy. Keep this in sync with the server-side
    # caps (per-project maxFileSize / MAX_UPLOAD_SIZE): whichever is smaller
    # wins, and an nginx rejection is a 413 with an nginx HTML body, not the
    # server's JSON envelope. "0" disables the nginx-side check entirely.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For large streaming uploads (PUT /:projectId/<path>), stream the
        # body straight to the upstream instead of spooling it to disk first,
        # and give slow transfers room (timeouts are per read/write, not total):
        # proxy_request_buffering off;
        # proxy_http_version 1.1;
        # proxy_read_timeout 300s;
        # proxy_send_timeout 300s;
    }

    # certs example:
    # ssl_certificate     /etc/letsencrypt/live/uploads.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/uploads.example.com/privkey.pem;
}
